<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณค่าไฟฟ้าบ้านอยู่อาศัย (อัตราใหม่ PEA)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-purple-900 text-white p-6">
            <h1 class="text-2xl font-bold text-center">คำนวณค่าไฟฟ้าบ้านอยู่อาศัย (อัตราใหม่ PEA)</h1>
            <p class="text-purple-200 text-sm text-center mt-1">โครงสร้างอัตราค่าไฟฟ้าใหม่ เริ่มใช้ประจำเดือน กันยายน 2569</p>
        </div>

        <div class="p-6 space-y-6">
            <!-- Form Input -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">ประเภทผู้ใช้ไฟฟ้า</label>
                    <select id="userType" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:outline-none bg-slate-50">
                        <option value="1.1.1">1.1.1 บ้านอยู่อาศัย (เดิมใช้ไม่เกิน 150 หน่วย/เดือน)</option>
                        <option value="1.1.2">1.1.2 บ้านอยู่อาศัย (เดิมใช้เกิน 150 หน่วย/เดือน)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">จำนวนหน่วยไฟฟ้าที่ใช้ (หน่วย / kWh)</label>
                    <input type="number" id="units" placeholder="กรอกจำนวนหน่วย เช่น 350" min="0" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:outline-none text-lg">
                </div>

                <button onclick="calculateElectricBill()" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                    คำนวณค่าไฟฟ้าพลังงาน
                </button>
            </div>

            <hr class="border-slate-200">

            <!-- Result Display -->
            <div id="resultContainer" class="hidden space-y-4">
                <div class="bg-purple-50 p-4 rounded-xl border border-purple-100 flex justify-between items-center">
                    <span class="text-slate-700 font-semibold">รวมค่าพลังงานไฟฟ้าฐาน:</span>
                    <span id="totalBaseCost" class="text-2xl font-bold text-purple-900">0.00 บาท</span>
                </div>

                <!-- Breakdown Table -->
                <div>
                    <h3 class="text-sm font-semibold text-slate-600 mb-2">รายละเอียดการคำนวณตามขั้นบันได (อัตราใหม่)</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 border-b">
                                    <th class="p-2">ช่วงหน่วย</th>
                                    <th class="p-2 text-right">จำนวนหน่วย</th>
                                    <th class="p-2 text-right">อัตรา (บาท)</th>
                                    <th class="p-2 text-right">จำนวนเงิน (บาท)</th>
                                </tr>
                            </thead>
                            <tbody id="breakdownBody" class="divide-y divide-slate-100">
                                <!-- Data populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateElectricBill() {
            const userType = document.getElementById('userType').value;
            const unitsInput = parseFloat(document.getElementById('units').value);

            if (isNaN(unitsInput) || unitsInput < 0) {
                alert('กรุณากรอกจำนวนหน่วยไฟฟ้าให้ถูกต้อง');
                return;
            }

            let totalCost = 0;
            let breakdown = [];

            if (userType === '1.1.1') {
                // โครงสร้างประเภท 1.1.1 อัตราใหม่ (ก.ย. 2569)
                // 0 - 15   : 2.3488
                // 16 - 25  : 2.9882
                // 26 - 200 : 3.0000
                // 201 - 400: 4.1584
                // 401 ขึ้นไป: 4.3583
                const tiers = [
                    { min: 0, max: 15, rate: 2.3488, label: 'หน่วยที่ 1 - 15' },
                    { min: 15, max: 25, rate: 2.9882, label: 'หน่วยที่ 16 - 25' },
                    { min: 25, max: 200, rate: 3.0000, label: 'หน่วยที่ 26 - 200' },
                    { min: 200, max: 400, rate: 4.1584, label: 'หน่วยที่ 201 - 400' },
                    { min: 400, max: Infinity, rate: 4.3583, label: 'หน่วยที่ 401 เป็นต้นไป' }
                ];

                let remainingUnits = unitsInput;
                for (let tier of tiers) {
                    if (unitsInput > tier.min) {
                        let tierUnits = Math.min(unitsInput, tier.max) - tier.min;
                        let cost = tierUnits * tier.rate;
                        totalCost += cost;
                        breakdown.push({
                            label: tier.label,
                            units: tierUnits,
                            rate: tier.rate,
                            cost: cost
                        });
                    }
                }
            } else if (userType === '1.1.2') {
                // โครงสร้างประเภท 1.1.2 อัตราใหม่ (ก.ย. 2569)
                // 0 - 200  : 3.0000
                // 201 - 400: 4.1584
                // 401 ขึ้นไป: 4.3583
                const tiers = [
                    { min: 0, max: 200, rate: 3.0000, label: 'หน่วยที่ 1 - 200' },
                    { min: 200, max: 400, rate: 4.1584, label: 'หน่วยที่ 201 - 400' },
                    { min: 400, max: Infinity, rate: 4.3583, label: 'หน่วยที่ 401 เป็นต้นไป' }
                ];

                for (let tier of tiers) {
                    if (unitsInput > tier.min) {
                        let tierUnits = Math.min(unitsInput, tier.max) - tier.min;
                        let cost = tierUnits * tier.rate;
                        totalCost += cost;
                        breakdown.push({
                            label: tier.label,
                            units: tierUnits,
                            rate: tier.rate,
                            cost: cost
                        });
                    }
                }
            }

            // แสดงผลลัพธ์
            document.getElementById('totalBaseCost').innerText = totalCost.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + ' บาท';

            const tbody = document.getElementById('breakdownBody');
            tbody.innerHTML = '';
            breakdown.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-2 font-medium text-slate-700">${item.label}</td>
                        <td class="p-2 text-right">${item.units.toLocaleString()}</td>
                        <td class="p-2 text-right">${item.rate.toFixed(4)}</td>
                        <td class="p-2 text-right font-semibold text-slate-800">${item.cost.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")}</td>
                    </tr>
                `;
            });

            document.getElementById('resultContainer').classList.remove('hidden');
        }
    </script>
</body>
</html>
