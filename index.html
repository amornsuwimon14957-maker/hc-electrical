<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคำนวณวิศวกรรมไฟฟ้าแบบครบวงจร</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-btn.active {
      border-bottom: 3px solid #2563eb;
      color: #2563eb;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <h1 class="text-2xl font-bold text-slate-800 text-center mb-6">เครื่องมือคำนวณวิศวกรรมไฟฟ้า (Electrical Calculator Suite)</h1>
    
    <!-- Tab Navigation -->
    <div class="flex border-b border-slate-200 mb-6">
      <button class="tab-btn active flex-1 py-3 text-center text-slate-600 transition" onclick="switchTab('lighting')">1. คำนวณแสงสว่าง</button>
      <button class="tab-btn flex-1 py-3 text-center text-slate-600 transition" onclick="switchTab('wire')">2. คำนวณขนาดสายไฟ</button>
      <button class="tab-btn flex-1 py-3 text-center text-slate-600 transition" onclick="switchTab('volt-drop')">3. คำนวณแรงดันตก</button>
    </div>

    <!-- 1. TAB: LIGHTING CALCULATOR -->
    <div id="tab-lighting" class="tab-content">
      <h2 class="text-xl font-semibold mb-4 text-slate-700">คำนวณระบบแสงสว่าง (Lumen Method)</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-slate-600">ความยาวห้อง (ม.):</label>
          <input type="number" id="light-length" value="6" class="w-full mt-1 p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">ความกว้างห้อง (ม.):</label>
          <input type="number" id="light-width" value="4" class="w-full mt-1 p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">ความสว่างเป้าหมาย (Lux):</label>
          <select id="light-lux" class="w-full mt-1 p-2 border rounded-md">
            <option value="150">150 Lux (ทางเดิน/ห้องเก็บของ)</option>
            <option value="300">300 Lux (ห้องนั่งเล่น/พักผ่อน)</option>
            <option value="500" selected>500 Lux (สำนักงาน/ห้องทำงาน)</option>
            <option value="750">750 Lux (ห้องเขียนแบบ/งานละเอียด)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">ความสว่างโคมไฟ (Lumens/ชุด):</label>
          <input type="number" id="light-lumens" value="3600" class="w-full mt-1 p-2 border rounded-md" placeholder="เช่น 3600 lm สำหรับ LED Panel">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">กำลังไฟฟ้าต่อโคม (Watts):</label>
          <input type="number" id="light-watts" value="36" class="w-full mt-1 p-2 border rounded-md">
        </div>
      </div>
      <button onclick="calcLighting()" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">คำนวณแสงสว่าง</button>
      <div id="result-lighting" class="mt-4 p-4 bg-slate-50 rounded-md text-slate-700 hidden"></div>
    </div>

    <!-- 2. TAB: WIRE SIZING CALCULATOR -->
    <div id="tab-wire" class="tab-content hidden">
      <h2 class="text-xl font-semibold mb-4 text-slate-700">คำนวณขนาดสายไฟและขนาดเบรกเกอร์</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-slate-600">โหลดรวม (Watts):</label>
          <input type="number" id="wire-power" value="3500" class="w-full mt-1 p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">ระบบไฟฟ้า:</label>
          <select id="wire-phase" class="w-full mt-1 p-2 border rounded-md">
            <option value="1">1 เฟส (220V)</option>
            <option value="3">3 เฟส (380V)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">Power Factor (PF):</label>
          <input type="number" id="wire-pf" value="0.85" step="0.05" class="w-full mt-1 p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">เผื่อขนาดกระแส (Safety Factor):</label>
          <select id="wire-sf" class="w-full mt-1 p-2 border rounded-md">
            <option value="1.25">125% (มาตรฐานโหลดต่อเนื่อง)</option>
            <option value="1.0">100% (โหลดทั่วไป)</option>
          </select>
        </div>
      </div>
      <button onclick="calcWire()" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">คำนวณขนาดสายไฟ</button>
      <div id="result-wire" class="mt-4 p-4 bg-slate-50 rounded-md text-slate-700 hidden"></div>
    </div>

    <!-- 3. TAB: VOLTAGE DROP CALCULATOR -->
    <div id="tab-volt-drop" class="tab-content hidden">
      <h2 class="text-xl font-semibold mb-4 text-slate-700">คำนวณแรงดันตกในสาย (Voltage Drop)</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-slate-600">กระแสไฟฟ้าในวงจร (Amps):</label>
          <input type="number" id="vd-current" value="20" class="w-full mt-1 p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">ความยาวสายไฟ - ไปกลับ (เมตร):</label>
          <input type="number" id="vd-distance" value="50" class="w-full mt-1 p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">ขนาดสายไฟ (sq.mm.):</label>
          <select id="vd-wiresize" class="w-full mt-1 p-2 border rounded-md">
            <option value="1.5">1.5 sq.mm.</option>
            <option value="2.5" selected>2.5 sq.mm.</option>
            <option value="4">4 sq.mm.</option>
            <option value="6">6 sq.mm.</option>
            <option value="10">10 sq.mm.</option>
            <option value="16">16 sq.mm.</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600">แรงดันระบบ (Volts):</label>
          <input type="number" id="vd-voltage" value="220" class="w-full mt-1 p-2 border rounded-md">
        </div>
      </div>
      <button onclick="calcVoltageDrop()" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">คำนวณแรงดันตก</button>
      <div id="result-volt-drop" class="mt-4 p-4 bg-slate-50 rounded-md text-slate-700 hidden"></div>
    </div>

  </div>

  <script>
    // Tab Control
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      event.target.classList.add('active');
    }

    // 1. Lighting Calculation
    function calcLighting() {
      const length = parseFloat(document.getElementById('light-length').value);
      const width = parseFloat(document.getElementById('light-width').value);
      const targetLux = parseFloat(document.getElementById('light-lux').value);
      const lumens = parseFloat(document.getElementById('light-lumens').value);
      const watts = parseFloat(document.getElementById('light-watts').value);

      const area = length * width;
      const UF = 0.6; // Utilization Factor
      const MF = 0.8; // Maintenance Factor

      const totalLumens = (targetLux * area) / (UF * MF);
      const count = Math.ceil(totalLumens / lumens);
      const totalWatts = count * watts;
      const lpd = (totalWatts / area).toFixed(2);

      const resDiv = document.getElementById('result-lighting');
      resDiv.classList.remove('hidden');
      resDiv.innerHTML = `
        <p class="font-bold text-lg text-blue-600 mb-2">ผลการคำนวณระบบแสงสว่าง:</p>
        <ul class="list-disc pl-5 space-y-1">
          <li>พื้นที่ห้อง: <strong>${area.toFixed(2)} ตร.ม.</strong></li>
          <li>จำนวนโคมไฟที่ต้องใช้: <strong class="text-emerald-600 text-xl">${count} ชุด</strong></li>
          <li>กำลังไฟฟ้ารวม: <strong>${totalWatts} Watts</strong></li>
          <li>ความหนาแน่นพลังงาน (LPD): <strong>${lpd} W/ตร.ม.</strong> ${lpd <= 9 ? '✅ (ประหยัดพลังงานดีเยี่ยม)' : '⚠️ (อยู่ในเกณฑ์มาตรฐาน)'}</li>
        </ul>
      `;
    }

    // 2. Wire Sizing Calculation
    function calcWire() {
      const watts = parseFloat(document.getElementById('wire-power').value);
      const phase = parseInt(document.getElementById('wire-phase').value);
      const pf = parseFloat(document.getElementById('wire-pf').value);
      const sf = parseFloat(document.getElementById('wire-sf').value);

      let current = 0;
      if (phase === 1) {
        current = watts / (220 * pf);
      } else {
        current = watts / (Math.sqrt(3) * 380 * pf);
      }

      const designCurrent = current * sf;

      // ตารางขนาดสาย IEC 01 เทียบกับพิกัดกระแสแบบคร่าวๆ (เดินในท่อ)
      const wireTable = [
        { size: 1.5, maxAmp: 14 },
        { size: 2.5, maxAmp: 18 },
        { size: 4, maxAmp: 25 },
        { size: 6, maxAmp: 32 },
        { size: 10, maxAmp: 44 },
        { size: 16, maxAmp: 59 },
        { size: 25, maxAmp: 78 }
      ];

      let recWire = wireTable.find(w => w.maxAmp >= designCurrent) || { size: '>25', maxAmp: 'N/A' };
      let recBreaker = Math.ceil(designCurrent / 5) * 5; // ปรับขนาดเบรกเกอร์ตามมาตรฐาน

      const resDiv = document.getElementById('result-wire');
      resDiv.classList.remove('hidden');
      resDiv.innerHTML = `
        <p class="font-bold text-lg text-blue-600 mb-2">ผลการคำนวณขนาดสายไฟ:</p>
        <ul class="list-disc pl-5 space-y-1">
          <li>กระแสไฟฟ้าใช้งาน (IB): <strong>${current.toFixed(2)} A</strong></li>
          <li>กระแสออกแบบ (In = IB x ${sf}): <strong>${designCurrent.toFixed(2)} A</strong></li>
          <li>ขนาดสายทองแดงแนะนำ (THW / IEC 01): <strong class="text-emerald-600 text-xl">${recWire.size} sq.mm.</strong> (ทนกระแสได้ ${recWire.maxAmp}A)</li>
          <li>ขนาด Main Breaker แนะนำ: <strong>${recBreaker} A</strong></li>
        </ul>
      `;
    }

    // 3. Voltage Drop Calculation
    function calcVoltageDrop() {
      const current = parseFloat(document.getElementById('vd-current').value);
      const distance = parseFloat(document.getElementById('vd-distance').value);
      const wireSize = parseFloat(document.getElementById('vd-wiresize').value);
      const vSystem = parseFloat(document.getElementById('vd-voltage').value);

      // ความต้านทานสายทองแดงประมาณค่า (Ohm/km)
      const resTable = { 1.5: 14.8, 2.5: 8.87, 4: 5.52, 6: 3.69, 10: 2.19, 16: 1.38 };
      const resistance = resTable[wireSize] || 1.0;

      // VD = 2 x I x L x R / 1000 (สำหรับ 1-Phase)
      const vDrop = (2 * current * distance * (resistance / 1000));
      const vDropPercent = (vDrop / vSystem) * 100;

      const resDiv = document.getElementById('result-volt-drop');
      resDiv.classList.remove('hidden');
      resDiv.innerHTML = `
        <p class="font-bold text-lg text-blue-600 mb-2">ผลการคำนวณแรงดันตก:</p>
        <ul class="list-disc pl-5 space-y-1">
          <li>แรงดันตกในสาย (Voltage Drop): <strong>${vDrop.toFixed(2)} Volts</strong></li>
          <li>คิดเป็นเปอร์เซ็นต์: <strong class="${vDropPercent <= 3 ? 'text-emerald-600' : 'text-red-600'} text-xl">${vDropPercent.toFixed(2)}%</strong></li>
          <li>แรงดันปลายสายที่เหลือ: <strong>${(vSystem - vDrop).toFixed(2)} Volts</strong></li>
          <li>สถานะมาตรฐาน (NEC/วสท. ไม่เกิน 3%): 
            <strong>${vDropPercent <= 3 ? '✅ ผ่านเกณฑ์มาตรฐาน' : '❌ แรงดันตกเกินมาตรฐาน (แนะนำเพิ่มขนาดสาย)'}</strong>
          </li>
        </ul>
      `;
    }
  </script>
</body>
</html>
